name: Build Windows

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Python
      # ----------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ----------------------------------------------------------
      # Install CVTR and PyInstaller
      # ----------------------------------------------------------
      - name: Install Dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install pyinstaller

      # ----------------------------------------------------------
      # Download Windows FFmpeg
      # ----------------------------------------------------------
      - name: Download FFmpeg
        shell: pwsh
        run: |
          $ffmpegVersion = "8.0.1"
          $url = "https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-$ffmpegVersion-essentials_build.zip"
          Write-Host "Downloading FFmpeg $ffmpegVersion..."
          Invoke-WebRequest `-Uri $url ` -OutFile "ffmpeg.zip"

      # ----------------------------------------------------------
      # Extract FFmpeg
      # ----------------------------------------------------------
      - name: Extract FFmpeg
        shell: pwsh
        run: |
          Expand-Archive `-Path "ffmpeg.zip" ` -DestinationPath "ffmpeg-download"

      # ----------------------------------------------------------
      # Locate FFmpeg Executables
      # ----------------------------------------------------------
      - name: Locate FFmpeg Binaries
        shell: pwsh
        run: |
          $ffmpeg = Get-ChildItem `
            -Path "ffmpeg-download" `
            -Recurse `
            -Filter "ffmpeg.exe" |
            Select-Object -First 1

          $ffprobe = Get-ChildItem `
            -Path "ffmpeg-download" `
            -Recurse `
            -Filter "ffprobe.exe" |
            Select-Object -First 1

          if (-not $ffmpeg) {
            throw "ffmpeg.exe was not found."
          }

          if (-not $ffprobe) {
            throw "ffprobe.exe was not found."
          }

          Write-Host "Found FFmpeg:"
          Write-Host $ffmpeg.FullName

          Write-Host "Found FFprobe:"
          Write-Host $ffprobe.FullName

          "FFMPEG_PATH=$($ffmpeg.FullName)" >> $env:GITHUB_ENV
          "FFPROBE_PATH=$($ffprobe.FullName)" >> $env:GITHUB_ENV
      
      # ----------------------------------------------------------
      # Build CVTR
      #
      # The destination "ffmpeg" is intentional.
      #
      # It produces:
      # dist/cvtr/
      #   cvtr.exe
      #   ffmpeg/
      #     ffmpeg.exe
      #     ffprobe.exe
      # _internal/
      # ----------------------------------------------------------
      - name: Build CVTR with PyInstaller
        shell: pwsh
        run: |
          pyinstaller `
            --clean `
            --noconfirm `
            --onedir `
            --name cvtr `
            --console `
            --paths src `
            --add-binary "$env:FFMPEG_PATH;ffmpeg" `
            --add-binary "$env:FFPROBE_PATH;ffmpeg" `
            src\cvtr\cli.py

      # ----------------------------------------------------------
      # Verify Expected Package Structure
      # ----------------------------------------------------------
      - name: Verify Package
        shell: pwsh
        run: |
          $requiredFiles = @(
            "dist\cvtr\cvtr.exe",
            "dist\cvtr\ffmpeg\ffmpeg.exe",
            "dist\cvtr\ffmpeg\ffprobe.exe",
          )

          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
              throw "Required file is missing: $file"
            }
            Write-Host "Found: $file"
          }

      # ----------------------------------------------------------
      # Test CVTR itself
      # ----------------------------------------------------------
      - name: Test CVTR
        shell: pwsh
        run: |
          .\dist\cvtr\cvtr.exe --help

      # ----------------------------------------------------------
      # Test Bundled FFmpeg
      # ----------------------------------------------------------
      - name: Test Bundled FFmpeg
        shell: pwsh
        run: |
          .\dist\cvtr\ffmpeg\ffmpeg.exe -version
          .\dist\cvtr\ffmpeg\ffprobe.exe -version

      # ----------------------------------------------------------
      # Create ZIP
      # ----------------------------------------------------------
      - name: Create Windows Package
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist\cvtr\*" `
            -DestinationPath "cvtr-windows-x64.zip"

      # ----------------------------------------------------------
      # Upload build artifact
      # ----------------------------------------------------------
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cvtr-windows-x64
          path: cvtr-windows-x64.zip
          if-no-files-found: error
